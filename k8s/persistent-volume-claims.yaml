apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-data
  namespace: ml-training
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-checkpoints
  namespace: ml-training
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
