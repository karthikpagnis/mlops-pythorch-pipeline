apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
        - name: serving
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CHECKPOINT_DIR
              value: /app/checkpoints
            - name: MODEL_NAME
              value: classifier_v1.pt
          volumeMounts:
            - name: checkpoints
              mountPath: /app/checkpoints
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: ml-checkpoints
