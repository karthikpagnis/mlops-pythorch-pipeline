apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: model-training
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: training-config
              mountPath: /app/configs
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: checkpoints
              mountPath: /app/checkpoints
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: training-config
          configMap:
            name: training-config
        - name: data
          persistentVolumeClaim:
            claimName: ml-data
        - name: checkpoints
          persistentVolumeClaim:
            claimName: ml-checkpoints
